[project]
name = "okf-mcp"
version = "1.28.1"
description = "MCP server for OKF vaults — 17 tools for AI agents to query, create, and analyze concepts"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.0.0", "pyyaml>=6.0"]
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
okf-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server", "measure"]
packages = ["cli", "cli.commands"]

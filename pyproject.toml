[project]
name = "okf-mcp"
version = "0.4.0"
description = "MCP server for OKF vaults — 17 tools for AI agents to query, create, and analyze concepts"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=1.0.0,<2", "pyyaml>=6.0"]
license = { text = "MIT" }
readme = "README.md"

# La versión se mantiene en cli/__init__.py (__version__) — single source of truth.
# Si cambia el paquete, actualizar AMBOS: cli/__init__.py y esta línea.

[project.scripts]
okf-mcp = "server:mcp.run"

[tool.setuptools]
py-modules = ["server", "measure"]
packages = ["cli", "cli.commands"]

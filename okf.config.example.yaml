# ──────────────────────────────────────────────────────────────
# .okf.config.yaml — MCP OKF configuration for your vault
# ──────────────────────────────────────────────────────────────
#
# HOW TO USE:
#   1. Copy this file to your vault root as .okf.config.yaml
#   2. Edit the sections to match your taxonomy
#   3. All keys are optional — defaults are used for anything missing
#
# RESOLUTION CHAIN (first found wins):
#   1. --config <path> in the CLI
#   2. $OKF_CONFIG environment variable
#   3. <vault>/.okf.config.yaml (next to your .md files)
#   4. ~/.config/okf/config.yaml (global user config)
#   5. Embedded defaults (shown here)
#
# PRINCIPLE:
#   "Hardcode fundamental domain rules, configure what changes."
#   The core contract (type + description + wikilinks) is a
#   fundamental rule and is not configurable. Taxonomy, thresholds,
#   and features are.
# ──────────────────────────────────────────────────────────────

# ── Taxonomy ────────────────────────────────────────────────
# Which types exist, which participate in the cybernetic loop,
# and which directory each one lives in.
types:
  # Valid types. Any type not in this list is rejected by
  # okf_new and flagged by okf_health.
  valid:
    - System
    - Agent
    - Decision
    - Plan
    - Project
    - Insight
    - Framework
    - Lesson
    - Tool
    - Spec
    - Skill
    - Workflow
    - Criterion
    - Session
    - Research
    - Handoff

  # Types that can have a cyber block (sensor → target_metric → review_on).
  # Only applies if you use the cybernetic loop.
  cyber:
    - System
    - Agent
    - Decision
    - Plan
    - Project
    - Insight

  # Types that NEVER get a cyber block even if --cyber is passed.
  excluded_cyber:
    - Framework
    - Lesson
    - Tool
    - Spec

  # Type → directory mapping. okf_new creates files in the
  # correct directory automatically.
  directory:
    System: system
    Agent: agents
    Decision: decisions
    Plan: plans
    Project: projects
    Insight: insights
    Framework: frameworks
    Lesson: lessons
    Tool: specs
    Spec: specs
    Skill: skills
    Workflow: workflows
    Criterion: criteria
    Session: sessions
    Research: research
    Handoff: handoffs

# ── Staleness Thresholds ─────────────────────────────────────
# Control the semantic staleness detector (okf_stale).
# A concept is marked STALE if it triggers 3+ of these 7 signals.
stale:
  # Days since last timestamp without being considered old.
  timestamp_days: 90

  # Days in "proposed" status without a decision.
  proposed_days: 30

  # Days without git commits touching this file.
  no_commits_days: 180

  # If >= this fraction of checkboxes are complete but the
  # description still references problems, signal 7 fires.
  checkbox_ratio: 0.7

  # Regex patterns (case-insensitive) that indicate problem
  # language in the description. If the description matches any
  # but checkboxes are >= checkbox_ratio complete, the
  # description is stale (signal 7 of the stale detector).
  problem_patterns:
    - \bno\s+(longer|working|available|implemented|connected|stored|notified)\b
    - \bbroken\b
    - \bfalse\b
    - \bmissing\b
    - \bnot\s+yet\b
    - \bpending\b
    - \bincomplete\b
    - \bplaceholder\b
    - \bclaims?\s+false\b
    - \b404\b
    - \bno\s+metrics\b

# ── Cybernetic Review Cycle ──────────────────────────────────
cyber:
  # Days until review_on assigned to new concepts with --cyber.
  # okf_review lists concepts whose review_on date has passed.
  review_days: 14

# ── Health Check ─────────────────────────────────────────────
health:
  # Slug of a concept that exists in your vault. The health check
  # uses it to verify that okf_traverse and okf_read work.
  # Change this to one of your concepts.
  smoke_entry_point: tp3-cibernetico

# ── Exclusions ───────────────────────────────────────────────
# Files and directories ignored by the indexer, find_md_files,
# and the health check.
exclude:
  # Exact filenames to exclude.
  files:
    - index.md
    - log.md
    - dashboard.md

  # Directory names to exclude (at any level).
  dirs:
    - .git
    - .obsidian
    - Templates
    - scripts
    - references
    - assets

# ── Optional Features ────────────────────────────────────────
features:
  # Cognitive Trace: event persistence (SQLite + JSONL)
  # for visualizing agent activity in Obsidian.
  #   true  → MCP persists events and exposes okf_analytics
  #   false → MCP is a pure wrapper, no extra dependencies
  cognitive_trace: true

  # Plugin hash sync: verifies the Obsidian plugin matches
  # the spec in the vault (check 8 of okf_health).
  # Only relevant if you use Obsidian + Cognitive Trace.
  plugin_hash_sync: true

  # Cybernetic loop tools (okf_review, cyber block in health,
  # --cyber flag in okf_new).
  #   true  → full cyber loop support
  #   false → vault-only mode, no cyber tools exposed
  cyber_loop: true

  # Custom paths for Cognitive Trace.
  # null = use defaults (~/.hermes/cognitive-trace.db and
  # <vault>/.obsidian/plugins/cognitive-trace/event_log.jsonl)
  # Sinks de telemetría: rutas RELATIVAS se resuelven contra el vault (portables).
  # Dejarlos null → ~/.hermes/cognitive-trace.db + <vault>/.obsidian/plugins/cognitive-trace/event_log.jsonl.
  # En harnesses con sandbox (dsh web solo escribe en el vault), apuntar aquí:
  trace_db_path: .obsidian/plugins/cognitive-trace/trace.db
  trace_jsonl_path: .obsidian/plugins/cognitive-trace/event_log.jsonl

# ── Body Templates ──────────────────────────────────────────
# Templates that okf_new inserts as the initial body for each type.
# If a type has no template, a minimal generic one is used.
# You can add templates for your own types.
templates:
  Decision: |
    ## Context

    (What triggered this decision? What problem does it solve?)

    ## Decision

    (What was decided? What alternatives were rejected?)

    ## Impact

    (What changes from now on?)

  Plan: |
    ## Objective

    (What do we want to achieve?)

    ## Phases

    1.
    2.
    3.

    ## Metrics

    (How do we measure success?)

  Project: |
    ## Vision

    (What is this project? Why does it exist?)

    ## Status

    **Current phase:** (planning / development / production / abandoned)

    ## Components

    -
    -

  Insight: |
    ## Observation

    (What pattern or connection was detected?)

    ## Implication

    (What does this mean? What action does it suggest?)

    ## Verification

    (How is this insight confirmed or disproven?)

  System: |
    ## What it does

    (What configuration or behavior does it control in the agentic system?)

    ## Where it lives

    (Config file, environment variable, skill?)

    ## Why

    (What problem does it solve? What would happen if removed?)

    ## Relationships

    -

  Agent: |
    ## Role

    (What role does this agent play in the ecosystem?)

    ## Capabilities

    -
    -

    ## Configuration

    (Model, tools, assigned skills?)

    ## AGENT.md / SOUL.md

    (Where is its definition file?)

  Skill: |
    ## Identity

    | Field | Value |
    |---|---|
    | **Name** | (skill name) |
    | **Repo** | (URL) |
    | **Hermes Path** | `~/.hermes/skills/<category>/<name>/` |

    ## What it does

    (What problem does this skill solve? When should the agent load it?)

    ## Dependencies

    -
    -

    ## Files

    (SKILL.md, references/, scripts/?)

  Workflow: |
    ## Problem it solves

    (What problem does this workflow solve? When should an agent suggest it?)

    ## Architecture

    (Abstract components: sensor → criterion → classification → action)

    ## Procedure

    1.
    2.
    3.

    ## Quality criteria

    (How do we know the workflow is working?)

    ## OKF Instantiation

    (Reference to the concrete instance in our ecosystem)

  Handoff: |
    ## Context

    (What was being done, and why — 2-3 sentences)

    ## Completed

    - [ ] (items with [x] and the commit that completed them)

    ## Pending

    - [ ] (prioritized items with files, lines, likely causes)

    ## Verifiable state

    (commit hash, test_pass_rate, files modified — checkable data, not narrative)

    ## Ecosystem signals

    (new decisions, health checks, watchdogs, relevant insights at close)

    ## How to resume

    (boot instruction for the next session: where to start, what to read first)
